                '<div class="project-overlay">' +
                  '<h3 class="project-title">' + project.title + '</h3>' +
                '</div>' +
              '</a>'
            ).join('');
          }

          // Render Project Detail
          function renderProjectDetail(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            const content = 
              '<div class="project-detail-container">' +
                '<article>' +
                  '<a href="#" class="back-button" data-navigate="home">' +
                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">' +
                      '<path d="M19 12H5M12 19l-7-7 7-7"/>' +
                    '</svg>' +
                    'Back to Projects' +
                  '</a>' +
                  '<img src="' + project.image + '" alt="' + project.title + '" class="project-detail-image" />' +
                  '<h1>' + project.title + '</h1>' +
                  '<p>A comprehensive design project showcasing innovative ' + project.category + ' work with attention to detail and user-centric approach.</p>' +
                  '<h2>The Challenge</h2>' +
                  '<p>This project required a complete rethinking of the user experience, focusing on creating an intuitive and engaging interface that would drive user engagement and satisfaction.</p>' +
                  '<blockquote>"We needed a design that not only looked great but also delivered measurable results."</blockquote>' +
                  '<h3>Research & Discovery</h3>' +
                  '<p>Our team conducted extensive user research to understand the pain points:</p>' +
                  '<ul>' +
                    '<li>Complex navigation structure</li>' +
                    '<li>Poor visual hierarchy</li>' +
                    '<li>Inconsistent design patterns</li>' +
                    '<li>Performance optimization needs</li>' +
                  '</ul>' +
                  '<h3>Results</h3>' +
                  '<table>' +
                    '<thead>' +
                      '<tr><th>Metric</th><th>Before</th><th>After</th><th>Change</th></tr>' +
                    '</thead>' +
                    '<tbody>' +
                      '<tr><td>User Engagement</td><td>2.3 min</td><td>9.2 min</td><td>+300%</td></tr>' +
                      '<tr><td>Bounce Rate</td><td>68%</td><td>23%</td><td>-66%</td></tr>' +
                      '<tr><td>User Retention</td><td>34%</td><td>78%</td><td>+129%</td></tr>' +
                    '</tbody>' +
                  '</table>' +
                '</article>' +
                '<aside>' +
                  '<div class="project-info-card">' +
                    '<h3>Project Details</h3>' +
                    '<dl>' +
                      '<div><dt>Category</dt><dd>' + project.category + '</dd></div>' +
                      '<div><dt>Year</dt><dd>2024</dd></div>' +
                      '<div><dt>Role</dt><dd>Lead Designer</dd></div>' +
                      '<div><dt>Tools</dt><dd>Figma, Adobe Suite</dd></div>' +
                    '</dl>' +
                  '</div>' +
                '</aside>' +
              '</div>';

            document.getElementById('project-detail-desktop').innerHTML = content;
            document.getElementById('project-detail-mobile').innerHTML = content;
          }

          // Initialize
          document.addEventListener('DOMContentLoaded', function() {
            renderGallery('desktop-gallery');
            renderGallery('mobile-gallery');

            // Navigation click handlers
            document.addEventListener('click', function(e) {
              const navLink = e.target.closest('[data-navigate]');
              if (navLink) {
                e.preventDefault();
                navigateTo(navLink.dataset.navigate);
              }

              const projectCard = e.target.closest('[data-project]');
              if (projectCard) {
                e.preventDefault();
                navigateTo('project', projectCard.dataset.project);
              }
            });
          });
        `}} />
      </body>
    </html>
  )
}
