<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Gallery Slider</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0a0a;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .gallery-container {
      position: relative;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .ambient-background {
      position: absolute;
      inset: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .blur-overlay {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(60px);
      -webkit-backdrop-filter: blur(60px);
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
    }

    .slide-counter {
      display: flex;
      gap: .5rem;
      padding: .5rem 1rem;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
    }

    .slider {
      position: relative;
      display: flex;
      height: 100%;
      align-items: center;
      cursor: grab;
    }

    .slider-track {
      display: flex;
      gap: 4rem;
      padding-left: calc(50vw - 250px);
      transition: transform .6s cubic-bezier(.32,.72,0,1);
    }

    .artwork-card {
      flex-shrink: 0;
      transition: .4s;
      opacity: .5;
      transform: scale(.85);
    }

    .artwork-card.active {
      opacity: 1;
      transform: scale(1);
    }

    .card-content {
      width: 500px;
      height: 500px;
      padding: .75rem;
      border-radius: 1rem;
      overflow: hidden;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
    }

    .card-content img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: .75rem;
    }

    .navigation-dots {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: .5rem;
      padding: .75rem 1rem;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
    }

    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.3);
      cursor: pointer;
      transition: .3s;
    }

    .nav-dot.active {
      width: 24px;
      background: #fff;
    }

    @media (max-width: 768px) {
      .card-content {
        width: 360px;
        height: 360px;
      }
    }
  </style>
</head>

<body>
  <div class="gallery-container">
    <div class="ambient-background" id="ambientBg"></div>
    <div class="blur-overlay"></div>

    <header class="header">
      <h1>Gallery</h1>
      <div class="slide-counter">
        <span id="currentSlide">01</span>/<span id="totalSlides">07</span>
      </div>
    </header>

    <div class="slider" id="slider">
      <div class="slider-track" id="sliderTrack"></div>
    </div>

    <div class="navigation-dots" id="navigationDots"></div>
  </div>

  <script>
    const artworks = [
      { title: "Ethereal Dreams", image: "https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=800&q=80" },
      { title: "Urban Fragments", image: "https://images.unsplash.com/photo-1577083288073-40892c0860a4?w=800&q=80" },
      { title: "Coastal Serenity", image: "https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=800&q=80" },
      { title: "Abstract Reverie", image: "https://images.unsplash.com/photo-1536924940846-227afb31e2a5?w=800&q=80" },
      { title: "Digital Landscapes", image: "https://images.unsplash.com/photo-1550859492-d5da9d8e45f3?w=800&q=80" },
      { title: "Whispers of Color", image: "https://images.unsplash.com/photo-1482160549825-59d1b23cb208?w=800&q=80" },
      { title: "Metropolis", image: "https://images.unsplash.com/photo-1501472312651-726afe119ff1?w=800&q=80" },
    ];

    let currentIndex = 0;

    const track = document.getElementById("sliderTrack");
    const dots = document.getElementById("navigationDots");
    const current = document.getElementById("currentSlide");
    const total = document.getElementById("totalSlides");

    total.textContent = artworks.length.toString().padStart(2, "0");

    function render() {
      track.innerHTML = artworks.map((art, i) => `
        <div class="artwork-card ${i === currentIndex ? "active" : ""}">
          <div class="card-content">
            <img src="${art.image}" alt="${art.title}">
          </div>
        </div>
      `).join("");

      dots.innerHTML = artworks.map((_, i) => `
        <div class="nav-dot ${i === currentIndex ? "active" : ""}" onclick="goTo(${i})"></div>
      `).join("");

      track.style.transform = `translateX(${-currentIndex * 564}px)`;
      current.textContent = String(currentIndex + 1).padStart(2, "0");
    }

    function goTo(i) {
      currentIndex = i;
      render();
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" && currentIndex < artworks.length - 1) currentIndex++;
      if (e.key === "ArrowLeft" && currentIndex > 0) currentIndex--;
      render();
    });

    render();
  </script>
</body>
</html>
