<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTERFACE - Hero Section</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    /* Reset e Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #141414;
      --foreground: #f0f0f0;
      --muted-foreground: #888888;
      --accent: #f97316;
      --border: #3d3d3d;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: 'IBM Plex Sans', sans-serif;
    }

    ::selection {
      background: var(--accent);
      color: var(--background);
    }

    /* Noise Canvas */
    #noise-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.03;
      mix-blend-mode: overlay;
    }

    /* Hero Section */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-left: 7rem;
      padding-right: 3rem;
    }

    @media (max-width: 768px) {
      .hero {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }

    /* Side Label */
    .side-label {
      position: absolute;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
    }

    .side-label span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--muted-foreground);
      transform: rotate(-90deg);
      transform-origin: left center;
      display: block;
      white-space: nowrap;
    }

    /* Main Content */
    .hero-content {
      flex: 1;
      width: 100%;
    }

    /* Split Flap Text */
    .split-flap-container {
      display: inline-flex;
      gap: 0.08em;
      align-items: center;
      cursor: pointer;
      perspective: 1000px;
    }

    .split-flap-char {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 15vw, 14rem);
      width: 0.65em;
      height: 1.05em;
      background-color: #000;
      transform-style: preserve-3d;
      transition: background-color 0.15s ease;
    }

    .split-flap-char.flipping {
      background-color: rgba(249, 115, 22, 0.2);
    }

    .split-flap-char .divider {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: rgba(0, 0, 0, 0.2);
      pointer-events: none;
      z-index: 10;
    }

    .split-flap-char .top-half,
    .split-flap-char .bottom-half {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .split-flap-char .top-half {
      top: 0;
      bottom: 50%;
      align-items: flex-end;
    }

    .split-flap-char .bottom-half {
      top: 50%;
      bottom: 0;
      align-items: flex-start;
    }

    .split-flap-char .char-display {
      color: #fff;
      line-height: 1;
      transition: color 0.15s ease;
    }

    .split-flap-char.flipping .char-display {
      color: var(--accent);
    }

    .split-flap-char .top-half .char-display {
      transform: translateY(0.52em);
    }

    .split-flap-char .bottom-half .char-display {
      transform: translateY(-0.52em);
    }

    .split-flap-space {
      width: 0.3em;
      font-size: clamp(4rem, 15vw, 14rem);
    }

    /* Mute Toggle */
    .mute-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted-foreground);
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      transition: color 0.2s ease;
    }

    .mute-toggle:hover {
      color: var(--foreground);
    }

    .mute-toggle svg {
      width: 16px;
      height: 16px;
    }

    /* Subtitle */
    .subtitle {
      font-family: 'Bebas Neue', sans-serif;
      color: rgba(136, 136, 136, 0.6);
      font-size: clamp(1rem, 3vw, 2rem);
      margin-top: 1rem;
      letter-spacing: 0.05em;
    }

    /* Description */
    .description {
      margin-top: 3rem;
      max-width: 28rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.875rem;
      color: var(--muted-foreground);
      line-height: 1.6;
    }

    /* Buttons */
    .buttons {
      margin-top: 4rem;
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      border: 1px solid rgba(240, 240, 240, 0.2);
      padding: 0.75rem 1.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--foreground);
      text-decoration: none;
      transition: all 0.2s ease;
      background: transparent;
    }

    .btn-primary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary:hover .chevron {
      transform: rotate(45deg);
    }

    .chevron {
      transition: transform 0.4s ease;
    }

    .btn-secondary {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted-foreground);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .btn-secondary:hover {
      color: var(--foreground);
    }

    /* Floating Tag */
    .floating-tag {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
    }

    @media (min-width: 768px) {
      .floating-tag {
        bottom: 3rem;
        right: 3rem;
      }
    }

    .floating-tag div {
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted-foreground);
    }

    /* Scramble Text */
    .scramble-text {
      display: inline-block;
    }

    /* Animation for initial entrance */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .split-flap-char {
      opacity: 0;
      animation: fadeInUp 0.3s ease forwards;
    }
  </style>
</head>
<body>
  <section class="hero">
    <!-- Animated Noise Canvas -->
    <canvas id="noise-canvas"></canvas>

    <!-- Side Label -->
    <div class="side-label">
      <span>SIGNAL</span>
    </div>

    <!-- Main Content -->
    <div class="hero-content">
      <!-- Split Flap Text -->
      <div class="split-flap-container" id="split-flap" aria-label="INTERFACE">
        <!-- Characters will be generated by JS -->
      </div>

      <!-- Mute Toggle -->
      <div style="margin-top: 1rem;">
        <button class="mute-toggle" id="mute-toggle" aria-label="Toggle sound">
          <svg id="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
            <line x1="22" y1="9" x2="22" y2="15"></line>
            <line x1="18" y1="5" x2="18" y2="19"></line>
          </svg>
          <svg id="unmute-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
            <path d="m23 9-6 6"></path>
            <path d="m17 9 6 6"></path>
          </svg>
          <span id="mute-text">Sound Off</span>
        </button>
      </div>

      <!-- Subtitle -->
      <h2 class="subtitle">Studies in Controlled Environments</h2>

      <!-- Description -->
      <p class="description">
        We design systems that behave, not just screens that display. Signals from the edge of what's shippable.
      </p>

      <!-- Buttons -->
      <div class="buttons">
        <a href="#work" class="btn-primary">
          <span class="scramble-text" id="scramble-btn" data-text="View Experiments">View Experiments</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 27 27" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.85715 3.85715H19.2857L23.0553 7.64066L17.5163 13.1595L22.8462 17.5055V23.1429H17.5055V13.1703L7.65696 22.9832L3.8874 19.2L13.9259 9.19781H3.85715V3.85715Z" fill="currentColor"/>
          </svg>
        </a>
        <a href="#signals" class="btn-secondary">Latest Signals</a>
      </div>
    </div>

    <!-- Floating Tag -->
    <div class="floating-tag">
      <div>v.01 / Experimental Build</div>
    </div>
  </section>

  <script>
    // ==========================================
    // ANIMATED NOISE
    // ==========================================
    (function initNoise() {
      const canvas = document.getElementById('noise-canvas');
      const ctx = canvas.getContext('2d');
      let animationId;
      let frame = 0;

      function resize() {
        canvas.width = canvas.offsetWidth / 2;
        canvas.height = canvas.offsetHeight / 2;
      }

      function generateNoise() {
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 255;
          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
          data[i + 3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);
      }

      function animate() {
        frame++;
        if (frame % 2 === 0) {
          generateNoise();
        }
        animationId = requestAnimationFrame(animate);
      }

      resize();
      window.addEventListener('resize', resize);
      animate();
    })();

    // ==========================================
    // AUDIO CONTEXT FOR SPLIT FLAP
    // ==========================================
    const AudioManager = {
      isMuted: true,
      audioContext: null,

      getAudioContext() {
        if (!this.audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.audioContext = new AudioContextClass();
          }
        }
        return this.audioContext;
      },

      playClick() {
        if (this.isMuted) return;

        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;

          if (ctx.state === 'suspended') {
            ctx.resume();
          }

          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          const lowpass = ctx.createBiquadFilter();

          oscillator.type = 'square';
          oscillator.frequency.setValueAtTime(800 + Math.random() * 400, ctx.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.015);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1200, ctx.currentTime);
          filter.Q.setValueAtTime(0.8, ctx.currentTime);

          lowpass.type = 'lowpass';
          lowpass.frequency.value = 2500;
          lowpass.Q.value = 0.5;

          gainNode.gain.setValueAtTime(0.05, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);

          oscillator.connect(filter);
          filter.connect(gainNode);
          gainNode.connect(lowpass);
          lowpass.connect(ctx.destination);

          oscillator.start(ctx.currentTime);
          oscillator.stop(ctx.currentTime + 0.02);
        } catch (e) {
          // Audio not supported
        }
      },

      toggleMute() {
        this.isMuted = !this.isMuted;
        
        const muteIcon = document.getElementById('mute-icon');
        const unmuteIcon = document.getElementById('unmute-icon');
        const muteText = document.getElementById('mute-text');

        if (this.isMuted) {
          muteIcon.style.display = 'none';
          unmuteIcon.style.display = 'block';
          muteText.textContent = 'Sound Off';
        } else {
          muteIcon.style.display = 'block';
          unmuteIcon.style.display = 'none';
          muteText.textContent = 'Sound On';
          
          try {
            const ctx = this.getAudioContext();
            if (ctx && ctx.state === 'suspended') {
              ctx.resume();
            }
          } catch (e) {}
        }
      }
    };

    // Mute toggle button
    document.getElementById('mute-toggle').addEventListener('click', () => {
      AudioManager.toggleMute();
    });

    // ==========================================
    // SPLIT FLAP TEXT
    // ==========================================
    const CHARSET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
    const SPLIT_FLAP_TEXT = 'INTERFACE';
    const SPEED = 80;

    class SplitFlapDisplay {
      constructor(container, text, speed = 50) {
        this.container = container;
        this.text = text.toUpperCase();
        this.speed = speed;
        this.chars = [];
        this.hasInitialized = false;
        this.init();
      }

      init() {
        this.container.innerHTML = '';
        
        this.text.split('').forEach((char, index) => {
          if (char === ' ') {
            const space = document.createElement('div');
            space.className = 'split-flap-space';
            this.container.appendChild(space);
            this.chars.push({ element: space, isSpace: true });
          } else {
            const charEl = this.createCharElement(index);
            this.container.appendChild(charEl);
            this.chars.push({ 
              element: charEl, 
              isSpace: false, 
              targetChar: char,
              index: index 
            });
          }
        });

        // Start animation
        this.animate();

        // Add hover to re-animate
        this.container.addEventListener('mouseenter', () => {
          if (this.hasInitialized) {
            this.animate(true);
          }
        });
      }

      createCharElement(index) {
        const el = document.createElement('div');
        el.className = 'split-flap-char';
        el.style.animationDelay = `${index * 0.15}s`;
        el.innerHTML = `
          <div class="divider"></div>
          <div class="top-half">
            <span class="char-display"></span>
          </div>
          <div class="bottom-half">
            <span class="char-display"></span>
          </div>
        `;
        return el;
      }

      updateChar(charObj, displayChar, isSettled = false) {
        const displays = charObj.element.querySelectorAll('.char-display');
        displays.forEach(d => d.textContent = displayChar);
        
        if (isSettled) {
          charObj.element.classList.remove('flipping');
        } else {
          charObj.element.classList.add('flipping');
        }
      }

      animate(isHover = false) {
        const tileDelayMultiplier = isHover ? 400 : 800;

        this.chars.forEach((charObj, i) => {
          if (charObj.isSpace) return;

          const startDelay = 0.15 * i * tileDelayMultiplier;
          const baseFlips = 8;
          let flipIndex = 0;

          // Start with random char
          this.updateChar(charObj, CHARSET[Math.floor(Math.random() * CHARSET.length)], false);

          setTimeout(() => {
            const interval = setInterval(() => {
              const settleThreshold = baseFlips + i * 3;

              if (flipIndex >= settleThreshold) {
                clearInterval(interval);
                this.updateChar(charObj, charObj.targetChar, true);
                AudioManager.playClick();
                
                if (i === this.chars.length - 1) {
                  this.hasInitialized = true;
                }
                return;
              }

              this.updateChar(charObj, CHARSET[Math.floor(Math.random() * CHARSET.length)], false);
              
              if (flipIndex % 2 === 0) {
                AudioManager.playClick();
              }
              
              flipIndex++;
            }, this.speed);
          }, startDelay);
        });
      }
    }

    // Initialize Split Flap
    const splitFlapContainer = document.getElementById('split-flap');
    new SplitFlapDisplay(splitFlapContainer, SPLIT_FLAP_TEXT, SPEED);

    // ==========================================
    // SCRAMBLE TEXT ON HOVER
    // ==========================================
    const GLYPHS = '!@#$%^&*()_+-=<>?/\\[]{}Xx';

    class ScrambleText {
      constructor(element) {
        this.element = element;
        this.originalText = element.dataset.text || element.textContent;
        this.isAnimating = false;
        
        this.element.addEventListener('mouseenter', () => this.scramble());
      }

      scramble() {
        if (this.isAnimating) return;
        this.isAnimating = true;

        const text = this.originalText;
        const duration = 400; // ms
        const startTime = Date.now();
        const lockedIndices = new Set();

        const animate = () => {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const numLocked = Math.floor(progress * text.length);

          for (let i = 0; i < numLocked; i++) {
            lockedIndices.add(i);
          }

          const display = text.split('').map((char, i) => {
            if (lockedIndices.has(i)) return char;
            return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
          }).join('');

          this.element.textContent = display;

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            this.element.textContent = text;
            this.isAnimating = false;
          }
        };

        // Start with scrambled
        this.element.textContent = text.split('').map(() => 
          GLYPHS[Math.floor(Math.random() * GLYPHS.length)]
        ).join('');

        requestAnimationFrame(animate);
      }
    }

    // Initialize Scramble Text
    document.querySelectorAll('.scramble-text').forEach(el => {
      new ScrambleText(el);
    });
  </script>
</body>
</html>
