<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Play</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #000000;
      color: #000000;
      overflow-x: hidden;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      transition: all .4s ease;
      color: #ffffff;
    }

    nav.scrolled {
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      padding: 14px 28px;
      background: rgba(47, 45, 45, 0.4);
      backdrop-filter: blur(15px);
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
      color: #fff;
    }

    nav.scrolled .nav-icons {
      display: none;
    }

    .nav-center {
      display: flex;
      gap: 30px;
      font-weight: 600;
    }

    .logo {
  font-weight: 800;
  font-size: 1.4rem;
}

.nav-center span {
  font-size: 1.8rem;
  font-weight: 800;
}


    .nav-center span {
      cursor: pointer;
      position: relative;
    }

    .nav-center span::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 2px;
      background: #000;
      transition: .3s;
    }

    .nav-center span:hover::after {
      width: 100%;
    }

    .nav-icons i {
      margin-left: 15px;
      font-size: 25px;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee') center/cover fixed;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.25);
    }

    /* SECTION */
    section {
      position: relative;
      margin-top: -40px;
      background: #fff;
      padding: 140px 10%;
      border-radius: 40px 40px 0 0;
      z-index: 10;
    }

    .reveal {
      opacity: 0;
      transform: translateY(60px);
      transition: all .8s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      font-size: clamp(3.2rem, 6vw, 5.5rem);
      font-weight: 900;
      line-height: 1.01;
    }

    .cursive {
      font-family: 'Pacifico', cursive;
      font-weight: 400;
    }

    .subtext {
      margin-top: 30px;
      font-size: 1.1rem;
      max-width: 700px;
      color: #555;
      border-left: 4px solid #000;
      padding-left: 20px;
    }

    @media (max-width: 768px) {
      nav {
        padding: 15px 20px;
      }

      .nav-center {
        gap: 15px;
        font-size: 14px;
      }

      section {
        padding: 100px 6%;
      }
    }
  </style>
</head>
<body>

  <nav id="navbar">
    <div class="logo">PLAY</div>

    <div class="nav-center">
      <span>Home</span>
      <span>Adoles</span>
      <span>JVTD</span>
    </div>

    <div class="nav-icons">
      <i class="fab fa-instagram"></i>
      <i class="fab fa-tiktok"></i>
    </div>
  </nav>

  <div class="hero"></div>

  <section>
    <div class="reveal">
      <h1>
        Avivar e transformar a nossa
        <span class="cursive">geração</span>
        através do <span class="cursive">relacionamento</span><i>com CRISTO</i>!
      </h1>

      <p class="subtext">
        Não é sobre religião, é sobre vida real. Sobre pertencer, crescer juntos
        e viver algo que faz sentido de verdade.
      </p>
    </div>
  </section>

  <script>
    const nav = document.getElementById('navbar');
    const reveal = document.querySelector('.reveal');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 80) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }

      const top = reveal.getBoundingClientRect().top;
      const screen = window.innerHeight * 0.85;

      if (top < screen) {
        reveal.classList.add('active');
      }
    });
  </script>

</body>
</html>
