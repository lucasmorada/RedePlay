<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Células Adoles | Play</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #0a0a0a;
      color: #fff;
    }

    section {
      padding: 80px 6%;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      margin-bottom: 50px;
    }

    /* CARROSSEL */
    .carousel-wrapper {
      position: relative;
      overflow: hidden;
    }

    .carousel {
      display: flex;
      gap: 30px;
      transition: transform 0.5s ease;
    }

    .card {
      min-width: 300px;
      height: 420px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      opacity: 0;
      transition: 0.4s;
    }

    .card:hover .overlay {
      opacity: 1;
    }

    .overlay h3 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .overlay a {
      text-decoration: none;
      background: #fff;
      color: #000;
      padding: 12px;
      text-align: center;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .overlay a:hover {
      background: #dcdcdc;
    }

    /* BOTÕES */
    .controls {
      margin-top: 40px;
      display: flex;
      gap: 20px;
    }

    .controls button {
      background: transparent;
      border: 2px solid #fff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
    }

    .controls button:hover {
      background: #fff;
      color: #000;
    }

    @media (max-width: 768px) {
      .card {
        min-width: 260px;
        height: 380px;
      }
    }
  </style>
</head>
<body>

  <section>
    <h1>Células Adoles</h1>

    <div class="carousel-wrapper">
      <div class="carousel" id="carousel">

        <!-- CARD 1 -->
        <div class="card">
          <img src="img/celula1.jpg" alt="Célula Alpha">
          <div class="overlay">
            <h3>Célula Alpha</h3>
            <a href="https://wa.me/5541999999999" target="_blank">Contato</a>
          </div>
        </div>

        <!-- CARD 2 -->
        <div class="card">
          <img src="img/celula2.jpg" alt="Célula Fogo">
          <div class="overlay">
            <h3>Célula Fogo</h3>
            <a href="https://wa.me/5541999999999" target="_blank">Contato</a>
          </div>
        </div>

        <!-- CARD 3 -->
        <div class="card">
          <img src="img/celula3.jpg" alt="Célula Atos">
          <div class="overlay">
            <h3>Célula Atos</h3>
            <a href="https://wa.me/5541999999999" target="_blank">Contato</a>
          </div>
        </div>

        <!-- CARD 4 -->
        <div class="card">
          <img src="img/celula4.jpg" alt="Célula Roots">
          <div class="overlay">
            <h3>Célula Roots</h3>
            <a href="https://wa.me/5541999999999" target="_blank">Contato</a>
          </div>
        </div>

      </div>
    </div>

    <div class="controls">
      <button onclick="scrollCarousel(-1)">←</button>
      <button onclick="scrollCarousel(1)">→</button>
    </div>
  </section>

  <script>
    const carousel = document.getElementById("carousel");
    let scrollPosition = 0;

    function scrollCarousel(direction) {
      const cardWidth = 330;
      scrollPosition += direction * cardWidth;
      scrollPosition = Math.max(
        Math.min(scrollPosition, 0),
        -(carousel.scrollWidth - window.innerWidth + 100)
      );
      carousel.style.transform = `translateX(${scrollPosition}px)`;
    }
  </script>

</body>
</html>
