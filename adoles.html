<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Play — Contatos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #000;
      color: #fff;
    }

    /* GRID PRINCIPAL */
    .grid {
      min-height: 100vh;
      padding: 80px 6%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
    }

    /* CARD BASE */
    .card {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: #111;
    }

    /* CARD TEXTO (primeiro) */
    .card-text {
      padding: 40px;
      background: linear-gradient(135deg, #3b3b3b, #1a1a1a);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-text h1 {
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      font-weight: 900;
      line-height: 1.05;
    }

    .card-text p {
      margin-top: 20px;
      font-size: 1rem;
      color: #ddd;
      max-width: 90%;
    }

    /* CARD FOTO */
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      transition: filter .4s ease, transform .4s ease;
    }

    .photo-card:hover img {
      filter: grayscale(0%);
      transform: scale(1.05);
    }

    /* OVERLAY */
    .photo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.45);
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .4s ease;
    }

    .photo-card:hover .photo-overlay {
      opacity: 1;
    }

    /* BOTÃO WHATS */
    .whatsapp-btn {
      padding: 16px 26px;
      background: #25d366;
      color: #000;
      font-weight: 800;
      text-decoration: none;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      transition: transform .3s ease;
    }

    .whatsapp-btn:hover {
      transform: scale(1.08);
    }

    /* RESPONSIVO */
    @media (max-width: 600px) {
      .grid {
        padding: 60px 5%;
      }
    }
  </style>
</head>
<body>

  <main class="grid">

    <!-- CARD TEXTO -->
    <div class="card card-text">
      <h1>
        Nossa<br>
        Rede<br>
        Play
      </h1>

      <p>
        Pessoas reais, prontas pra te ouvir, caminhar junto e viver algo verdadeiro.
      </p>
    </div>

    <!-- FOTO 1 -->
    <div class="card photo-card">
      <img src="foto1.jpg" alt="Contato 1">
      <div class="photo-overlay">
        <a class="whatsapp-btn" href="https://wa.me/5541999999999" target="_blank">
          <i class="fab fa-whatsapp"></i>
          Conversar
        </a>
      </div>
    </div>

    <!-- FOTO 2 -->
    <div class="card photo-card">
      <img src="foto2.jpg" alt="Contato 2">
      <div class="photo-overlay">
        <a class="whatsapp-btn" href="https://wa.me/5541988888888" target="_blank">
          <i class="fab fa-whatsapp"></i>
          Conversar
        </a>
      </div>
    </div>

    <!-- FOTO 3 -->
    <div class="card photo-card">
      <img src="foto3.jpg" alt="Contato 3">
      <div class="photo-overlay">
        <a class="whatsapp-btn" href="https://wa.me/5541977777777" target="_blank">
          <i class="fab fa-whatsapp"></i>
          Conversar
        </a>
      </div>
    </div>

    <!-- FOTO 4 -->
    <div class="card photo-card">
      <img src="foto4.jpg" alt="Contato 4">
      <div class="photo-overlay">
        <a class="whatsapp-btn" href="https://wa.me/5541966666666" target="_blank">
          <i class="fab fa-whatsapp"></i>
          Conversar
        </a>
      </div>
    </div>

  </main>

</body>
</html>
