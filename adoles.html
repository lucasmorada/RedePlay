<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Play — Contatos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #000;
      color: #fff;
    }

    /* GRID PRINCIPAL */
    .dynamic-grid {
  min-height: 100vh;
  padding: 80px 6%;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 220px;
  gap: 24px;
  background: #000;
}

/* BASE CARD */
.card {
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  background: #111;
}

/* TEXTO */
.card-text {
  padding: 36px;
  background: linear-gradient(135deg, #2a2a2a, #0f0f0f);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-text.big {
  grid-column: span 3;
  grid-row: span 2;
}

.card-text .tag {
  font-size: .8rem;
  letter-spacing: 3px;
  opacity: .6;
}

.card-text h1 {
  font-size: clamp(2.8rem, 4vw, 3.6rem);
  font-weight: 900;
  line-height: 1.05;
}

.card-text p {
  font-size: .95rem;
  color: #ccc;
  max-width: 90%;
}

/* FOTO */
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%);
  transition: .5s ease;
}

.photo:hover img {
  filter: grayscale(0%);
  transform: scale(1.08);
}

/* TAMANHOS DIFERENTES */
.photo.tall {
  grid-row: span 2;
}

.photo.wide {
  grid-column: span 2;
}

/* OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: .4s ease;
}

.photo:hover .overlay {
  opacity: 1;
}

/* BOTÃO */
.overlay a {
  padding: 14px 28px;
  border-radius: 999px;
  background: #25d366;
  color: #000;
  font-weight: 800;
  text-decoration: none;
  transition: transform .3s ease;
}

.overlay a:hover {
  transform: scale(1.1);
}

/* MOBILE */
@media (max-width: 900px) {
  .dynamic-grid {
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 200px;
  }

  .card-text.big,
  .photo.wide {
    grid-column: span 2;
  }
}

  </style>
</head>
<body>

  <main class="dynamic-grid">

  <!-- CARD TEXTO -->
  <div class="card card-text big">
    <span class="tag">PLAY</span>
    <h1>
      nossa<br>
      rede<br>
      de<br>
      pessoas
    </h1>
    <p>
      Cada rosto aqui é alguém pronto pra te ouvir e caminhar com você.
    </p>
  </div>

  <!-- FOTO 1 -->
  <div class="card photo tall">
    <img src="foto1.jpg">
    <div class="overlay">
      <a href="https://wa.me/5541999999999" target="_blank">Conversar</a>
    </div>
  </div>

  <!-- FOTO 2 -->
  <div class="card photo">
    <img src="foto2.jpg">
    <div class="overlay">
      <a href="https://wa.me/5541988888888" target="_blank">Conversar</a>
    </div>
  </div>

  <!-- FOTO 3 -->
  <div class="card photo wide">
    <img src="foto3.jpg">
    <div class="overlay">
      <a href="https://wa.me/5541977777777" target="_blank">Conversar</a>
    </div>
  </div>

  <!-- FOTO 4 -->
  <div class="card photo">
    <img src="foto4.jpg">
    <div class="overlay">
      <a href="https://wa.me/5541966666666" target="_blank">Conversar</a>
    </div>
  </div>

</main>


</body>
</html>
